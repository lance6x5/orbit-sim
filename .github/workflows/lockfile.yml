name: Generate lockfile (temporary)

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm audit fix || true
      - run: npm audit || true
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
